name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # zbus is pure Rust: the release binary links only libc/libm/libgcc_s, no libdbus-1-dev needed.
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo build --release
      - run: cp target/release/hangar-computer-control hangar-computer-control-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: hangar-computer-control-linux-x86_64
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo build --release
      - run: Copy-Item target/release/hangar-computer-control.exe windows-agent.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows-agent.exe
  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" hangar-computer-control-linux-x86_64 windows-agent.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
